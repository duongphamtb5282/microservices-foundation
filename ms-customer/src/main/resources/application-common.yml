# Common Configuration (shared across all profiles)
mongo:
  enabled: true
  # This default URI is the one Spring Data actually uses (spring.data.mongodb.uri resolves
  # mongo.uri) — it MUST carry credentials, otherwise every query fails with "Command find
  # requires authentication" (error 13): a credential-less default here silently overrode the
  # dev profile's username/password (2026-08-25). Defaults match the compose root user
  # (admin/password123, authSource admin); MONGODB_URI overrides everything. URL-encode special
  # characters in passwords when overriding via MONGODB_USERNAME/MONGODB_PASSWORD.
  uri: ${MONGODB_URI:mongodb://${MONGODB_USERNAME:admin}:${MONGODB_PASSWORD:password123}@localhost:27017/customerdb?authSource=${MONGODB_AUTH_DATABASE:admin}}
  host: ${MONGODB_HOST:localhost}
  port: ${MONGODB_PORT:27017}
  database: ${MONGODB_DATABASE:customerdb}
  username: ${MONGODB_USERNAME:}
  password: ${MONGODB_PASSWORD:}
  authenticationDatabase: ${MONGODB_AUTH_DATABASE:admin}
  tlsEnabled: ${MONGODB_TLS_ENABLED:false}
  retryReads: ${MONGODB_RETRY_READS:true}
  retryWrites: ${MONGODB_RETRY_WRITES:true}
  readPreference: ${MONGODB_READ_PREFERENCE:primary}
  writeConcern: ${MONGODB_WRITE_CONCERN:MAJORITY}
  connectionTimeout: ${MONGODB_CONNECTION_TIMEOUT:PT10S}
  socketTimeout: ${MONGODB_SOCKET_TIMEOUT:PT30S}
  serverSelectionTimeout: ${MONGODB_SERVER_SELECTION_TIMEOUT:PT30S}
  pool:
    minSize: ${MONGODB_POOL_MIN_SIZE:0}
    maxSize: ${MONGODB_POOL_MAX_SIZE:20}
    maxWaitTime: ${MONGODB_MAX_WAIT_TIME:PT2S}
    maxConnectionLifeTime: ${MONGODB_MAX_CONNECTION_LIFE_TIME:PT0S}
    maxConnectionIdleTime: ${MONGODB_MAX_CONNECTION_IDLE_TIME:PT1M}

spring:
  application:
    name: ms-customer

  data:
    mongodb:
      # Spring Data MongoDB uses ONLY the URI when one is set — username/password below are ignored
      # in that case. The old fallback URI was credential-less, so every query failed with
      # "Command find requires authentication" (error 13). The fallback now embeds the credentials
      # (dev defaults = the compose root user admin/password123, authSource admin; prod/stg set
      # mongo.uri explicitly and their URI wins). URL-encode special characters in passwords, or
      # set MONGODB_URI to bypass this entirely.
      uri: ${mongo.uri:mongodb://${mongo.username:admin}:${mongo.password:password123}@${mongo.host:localhost}:${mongo.port:27017}/${mongo.database:customerdb}?authSource=${mongo.authenticationDatabase:admin}}
      host: ${mongo.host:localhost}
      port: ${mongo.port:27017}
      database: ${mongo.database:customerdb}
      username: ${mongo.username:admin}
      password: ${mongo.password:password123}
      authentication-database: ${mongo.authenticationDatabase:admin}

  kafka:
    consumer:
      group-id: customer-service
      auto-offset-reset: earliest
      # Fallback target class for records without a __TypeId__ header (written before 2026-08-25,
      # when core's producer still disabled type headers). user-events carries only UserCreatedEvent,
      # so a headerless payload is always decodable as it. Without this, the JsonDeserializer fails
      # with "no type information in headers" and the error handler retries the same offset forever.
      value-default-type: com.pacific.shared.events.UserCreatedEvent

  # JWT configuration moved to profile-specific files (dev, stg, prod)

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info,metrics

  endpoint:
    health:
      show-details: when_authorized

  metrics:
    export:
      prometheus:
        enabled: true
        step: 10s

    # JVM Metrics Configuration (Essential for production monitoring)
    jvm:
      gc:
        enabled: true # Garbage collection metrics
      memory:
        enabled: true # Heap/non-heap memory metrics
      thread:
        enabled: true # Thread count and state metrics
      classloader:
        enabled: true # Class loading metrics

    # HTTP Metrics Configuration (For error rate monitoring)
    web:
      server:
        request:
          autotime:
            enabled: true
            percentiles: 0.5,0.9,0.95,0.99
            percentiles-histogram: true

    # MongoDB Metrics Configuration (Database monitoring)
    mongodb:
      driver:
        pool:
          enabled: true # Connection pool metrics
      connectionpool:
        enabled: true # Connection pool size and usage
      commands:
        enabled: true # MongoDB command metrics

    # Custom Tags for all metrics
    tags:
      service: ${spring.application.name:ms-customer}
      environment: ${spring.profiles.active:default}
      version: "@project.version@"

customer:
  websocket:
    enabled: true

  events:
    customer-created:
      topic: customer.events
    customer-updated:
      topic: customer.events
    customer-status-changed:
      topic: customer.events

  api:
    max-page-size: 100
    default-page-size: 20

logging:
  level:
    com.pacific.customer: INFO
    reactor.netty: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

info:
  app:
    name: "@project.name@"
    description: "Customer Service - Reactive Microservice with WebSocket"
    version: "@project.version@"
    java:
      version: "@java.version@"
    spring:
      boot: "@spring-boot.version@"
