server:
  # Keycloak owns host port 8080 (auth-service/docker-compose.yml) — the gateway must not share
  # it, or JWKS fetches to localhost:8080 hit the gateway's own 404 instead of Keycloak.
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # Global filters (applied to all routes)
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

      routes:
        # ==================== AUTHENTICATION & AUTHORIZATION ====================

        # Auth Service Routes (Public). No StripPrefix: auth-service controllers are mapped at
        # /api/auth/* (AuthenticationController, RegistrationController) — the /api/v1 prefix
        # convention belongs to order/payment; forwarding here must keep the path intact.
        - id: auth-service-public
          uri: http://localhost:8082
          predicates:
            - Path=/api/auth/login, /api/auth/register, /api/auth/refresh, /api/auth/validate
          filters:
            # rate limiting removed: no RequestRateLimiter factory wired (F-37)

        # Auth Service Routes (Protected)
        - id: auth-service-protected
          uri: http://localhost:8082
          predicates:
            - Path=/api/auth/**
          filters:
            - AuthenticationFilter
            - ApiKeyAuthenticationFilter
            # rate limiting removed: no RequestRateLimiter factory wired (F-37)

        # ==================== ORDER MANAGEMENT ====================

        # Order Service V1 Routes (Protected)
        - id: order-service-v1
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - StripPrefix=1
            - AuthenticationFilter
            - ApiKeyAuthenticationFilter
            # rate limiting removed: no RequestRateLimiter factory wired (F-37)
            - name: CircuitBreaker
              args:
                name: order-service
                fallbackUri: forward:/fallback
            - AddRequestHeader=X-API-Version, 1.0

        # Order Service V2 Routes (Protected) - Enhanced Features
        - id: order-service-v2
          uri: http://localhost:8081
          predicates:
            - Path=/api/v2/orders/**
          filters:
            - StripPrefix=1
            - AuthenticationFilter
            - ApiKeyAuthenticationFilter
            # rate limiting removed: no RequestRateLimiter factory wired (F-37)
            - name: CircuitBreaker
              args:
                name: order-service
                fallbackUri: forward:/fallback
            - AddRequestHeader=X-API-Version, 2.0

        # Order Service V1 Health
        - id: order-service-v1-health
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/orders/health
          filters:
            - StripPrefix=1

        # Order Service V2 Health
        - id: order-service-v2-health
          uri: http://localhost:8081
          predicates:
            - Path=/api/v2/orders/health
          filters:
            - StripPrefix=1

        # Order Service Health
        - id: order-service-health
          uri: http://localhost:8081
          predicates:
            - Path=/actuator/health/**
          filters:
            - StripPrefix=0

        # ==================== PAYMENT PROCESSING ====================

        # Payment Service Routes (Protected)
        - id: payment-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - StripPrefix=1
            - AuthenticationFilter
            - ApiKeyAuthenticationFilter
            # rate limiting removed: no RequestRateLimiter factory wired (F-37)
            - name: CircuitBreaker
              args:
                name: payment-service
                fallbackUri: forward:/fallback

        # Payment Service Health
        - id: payment-service-health
          uri: http://localhost:8083
          predicates:
            - Path=/actuator/health/**
          filters:
            - StripPrefix=0

        # ==================== BACKWARD COMPATIBILITY ====================

        # Legacy routes for existing services
        - id: comment-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/comments/**
          filters:
            - StripPrefix=1
            - AuthenticationFilter
            # rate limiting removed: no RequestRateLimiter factory wired (F-37)

        # ==================== API DOCUMENTATION ====================

        # Swagger UI Aggregation
        - id: swagger-ui
          uri: http://localhost:8081
          predicates:
            - Path=/swagger-ui/**
          filters:
            - StripPrefix=0

        # OpenAPI Specs
        - id: openapi-order
          uri: http://localhost:8081
          predicates:
            - Path=/v3/api-docs/order
          filters:
            - RewritePath=/v3/api-docs/order, /v3/api-docs

        - id: openapi-payment
          uri: http://localhost:8083
          predicates:
            - Path=/v3/api-docs/payment
          filters:
            - RewritePath=/v3/api-docs/payment, /v3/api-docs

        # ==================== MONITORING & OBSERVABILITY ====================

        # Gateway Health
        - id: gateway-health
          uri: http://localhost:${SERVER_PORT:8088}
          predicates:
            - Path=/actuator/health/gateway
          filters:
            - RewritePath=/actuator/health/gateway, /actuator/health

        # Prometheus Metrics
        - id: gateway-metrics
          uri: http://localhost:${SERVER_PORT:8088}
          predicates:
            - Path=/actuator/prometheus
          filters:
            - StripPrefix=0

        # Circuit Breaker Events
        - id: circuitbreaker-events
          uri: http://localhost:${SERVER_PORT:8088}
          predicates:
            - Path=/actuator/circuitbreakerevents/**
          filters:
            - StripPrefix=0

  # ==================== FILTER CONFIGURATIONS ====================

  # Rate Limiting Configuration
  redis:
    rate-limiter:
      enabled: true

  # Custom Filters
  gateway:
    filters:
      authentication:
        enabled: true
        # Keycloak JWKS endpoint + expected issuer for local RS256 token verification (F-35).
        # Realm is "auth-service" (auth-service/docker/keycloak/realm-config/auth-service-realm.json);
        # Keycloak maps to host 8080 in auth-service/docker-compose.yml.
        jwks-url: ${GATEWAY_JWKS_URL:http://localhost:8080/realms/auth-service/protocol/openid-connect/certs}
        issuer: ${GATEWAY_ISSUER:http://localhost:8080/realms/auth-service}
        jwks-refresh-interval: ${GATEWAY_JWKS_REFRESH_INTERVAL:PT15M}
        exclude-paths: /api/auth/login,/api/auth/register,/actuator/**
      api-key:
        enabled: true
        header: X-API-Key
        exclude-paths: /actuator/**,/swagger-ui/**,/v3/api-docs/**

# backend-core SecurityService validates API keys LOCALLY against this list
# (ApiKeyAuthenticationFilter → SecurityService.validateApiKey). Dev default; override with
# GATEWAY_API_KEYS. Keys for protected routes in the doc: docs/AUTH_SERVICE_GATEWAY_TESTING.md
backend-core:
  security:
    valid-api-keys: ${GATEWAY_API_KEYS:dev-api-key-123}

# Resilience4j Configuration (Rate Limiting & Circuit Breaker)
resilience4j:
  ratelimiter:
    instances:
      auth-public:
        limit-for-period: 10
        limit-refresh-period: 1s
        timeout-duration: 0s
      auth-protected:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 0s
      order-service:
        limit-for-period: 50
        limit-refresh-period: 1s
        timeout-duration: 0s
      payment-service:
        limit-for-period: 20
        limit-refresh-period: 1s
        timeout-duration: 0s
      comment-service:
        limit-for-period: 30
        limit-refresh-period: 1s
        timeout-duration: 0s

  circuitbreaker:
    instances:
      order-service:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        fallbackUri: forward:/fallback
      payment-service:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        fallbackUri: forward:/fallback

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.pacific.gateway: INFO
    org.springframework.cloud.gateway: DEBUG
