plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '6.25.0'
    id 'checkstyle'
}

group = 'com.pacific'
version = '1.0.0'
description = 'API Gateway - Central entry point for all microservices'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceCompatibility = '21'

// Version configuration for dependencies
ext {
    backendCoreVersion = '1.0.0'
    useLocalDependencies = true // Set to false for production builds
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:3.5.5"
        // Spring Cloud 2025.0.0 is the release train paired with Boot 3.5.x. Without this BOM the
        // hard-coded component versions below resolve to the 2023.0.x-era libraries, and the
        // spring-cloud compatibility verifier refuses to start ("Spring Boot [3.5.5] is not
        // compatible with this Spring Cloud release train").
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.0.0"
    }
}

dependencies {
    // Backend Core Library (includes shared) - conditional dependency for development vs production
    if (project.file('../backend-core').isDirectory() && useLocalDependencies) {
        // Use local JAR file during development
        implementation fileTree(dir: '../backend-core/build/libs', include: '*.jar')
    } else {
        // Use published Maven artifact for production/CI builds
        implementation "com.pacific:backend-core:${backendCoreVersion}"
    }
    
    // Spring Cloud Gateway (version from the 2025.0.0 BOM)
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway'
    
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Spring Security Core — backend-core's SecurityService (used by ApiKeyAuthenticationFilter)
    // references security-core types; crypto alone is not enough to load the bean.
    implementation 'org.springframework.security:spring-security-core'
    
    // JWT Validation (local RS256 verification against Keycloak JWKS, F-35)
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // Circuit Breaker (version from the 2025.0.0 BOM)
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-reactor-resilience4j'
    
    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'org.projectlombok:lombok:1.18.38'
    
    // Test Dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.assertj:assertj-core:3.27.3'
}

// Spotless configuration for code formatting
spotless {
    java {
        target fileTree('.') {
            include '**/*.java'
            exclude '**/build/**', '**/generated/**', '**/target/**'
        }
        googleJavaFormat()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }

    yaml {
        target fileTree('.') {
            include '**/*.yml', '**/*.yaml'
            exclude '**/build/**', '**/target/**', '**/.github/**', '**/application-template.yml', '**/application-env-examples.yml', '**/application-example.yml'
        }
        prettier()
    }

    json {
        target fileTree('.') {
            include '**/*.json'
            exclude '**/build/**', '**/target/**'
        }
        prettier()
    }

    format 'misc', {
        target '*.md', '*.txt'
        trimTrailingWhitespace()
        endWithNewline()
    }
}

// Checkstyle configuration
checkstyle {
    configFile = rootProject.file('config/checkstyle/checkstyle.xml')
    showViolations = true
    maxWarnings = 0
    maxErrors = 0
    ignoreFailures = true
    reportsDir = layout.buildDirectory.dir("reports/checkstyle").get().asFile
}

// Code quality tasks
task codeQuality {
    group = 'verification'
    description = 'Runs all code quality checks (formatting, style, tests)'

    dependsOn 'spotlessCheck', 'checkstyleMain', 'checkstyleTest', 'test'
}

// Pre-commit hook task
task preCommit {
    group = 'verification'
    description = 'Runs pre-commit checks (formatting, style, compilation)'

    dependsOn 'spotlessCheck', 'checkstyleMain', 'compileJava', 'compileTestJava'
}

tasks.named('test') {
    useJUnitPlatform()
}
