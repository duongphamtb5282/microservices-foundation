spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/orders_db
    username: postgres
    password: postgres

  kafka:
    bootstrap-servers: localhost:9092

  jpa:
    # SQL off in dev: the outbox relay polls every 500ms (outbox.poll-interval), so show-sql/SQL
    # DEBUG floods the console with one SELECT per poll. Flip to true when debugging queries.
    show-sql: false

services:
  auth-service:
    url: http://localhost:8082

logging:
  level:
    root: INFO
    com.pacific.order: DEBUG
    com.pacific.core: DEBUG
    org.springframework.kafka: DEBUG
    org.hibernate.SQL: INFO
    feign: DEBUG
