spring:
  application:
    name: ms-order-service
  threads:
    virtual:
      enabled: true # F-32: virtual threads — thread-per-request without a 200-thread platform pool
  task:
    scheduling:
      # ADR-0011: separate the relay poll and cleanup jobs (plus any future schedulers) so one
      # @Scheduled job can never stall the other on the default single-thread scheduler.
      pool:
        size: 4

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orders_db}
    username: ${DB_USERNAME:auth_user}
    password: ${DB_PASSWORD:auth_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      # ADR-0009: pool as the deliberate concurrency limit (pool ≥ peak concurrency × query/request
      # time); 20 > 10 keeps headroom with the simulated gateway and virtual threads (ADR-0008).
      maximum-pool-size: ${DB_MAX_POOL_SIZE:20}
      pool-name: order-pool # ADR-0009: named pool for observability
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate # Use Liquibase for migrations
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false
    open-in-view: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: public

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # Cache Configuration
  cache:
    type: redis
    redis:
      time-to-live: 600000 # 10 minutes default TTL

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: order-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

# Kafka Configuration (backend-core messaging)
kafka:
  enabled: true # Enable/disable Kafka messaging
  cqrs:
    enabled: true
    command-topic: "order.commands"
    event-topic: "order.events"
  retry:
    maxAttempts: 3
    initial-backoff: 1s
    backoff-multiplier: 2.0
    enableDlq: true
    dlqTopicSuffix: ".dlq"
  monitoring:
    enabled: true

# Cache Configuration (backend-core caching)
cache:
  # Core's cache stack (CacheConfig + cache services) stays DISABLED here: order-service provides
  # its own cache stack (config/OrderCacheConfig with per-cache TTLs). Enabling core's would
  # register a second CacheManager/RedisTemplate and silently overwrite order's redisCacheManager
  # bean (same bean name in both configs).
  enabled: false # Enable/disable caching infrastructure
  metrics-enabled: true

# Order Service Configuration
order:
  messaging:
    order-events-topic: "order.events"
    order-commands-topic: "order.commands"
    payment-events-topic: "payment.events"

# External Services
services:
  auth-service:
    url: ${AUTH_SERVICE_URL:http://localhost:8082}

# Server Configuration
server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
    include-exception: false

# Management & Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    circuitbreakers:
      enabled: true

# Distributed tracing config removed (F-40): sleuth/zipkin blocks pointed at localhost:9411 but no
# micrometer-tracing/brave deps exist — the config was dead. Re-add with the tracing deps if tracing
# is introduced.

# Logging
logging:
  level:
    root: INFO
    com.pacific.order: DEBUG
    com.pacific.core: DEBUG
    org.springframework.kafka: INFO
    # INFO (was DEBUG): the outbox relay's 500ms poll made SQL DEBUG a perpetual console flood.
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Feign Configuration
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000
        loggerLevel: full

# Transactional outbox (ADR-0001) — relay publishes PENDING rows to Kafka
outbox:
  poll-interval: PT0.5S
  batch-size: 100
  max-attempts: 5
  cleanup-interval: PT24H
  retention-days: 7
