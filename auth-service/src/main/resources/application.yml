# Main application configuration
# Profile-specific configurations are loaded from application-{profile}.yml
# Common configuration is loaded from application-common.yml

spring:
  application:
    name: auth-service
  threads:
    virtual:
      enabled: true # F-32: virtual threads — thread-per-request without a 200-thread platform pool
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: optional:application-common.yml
